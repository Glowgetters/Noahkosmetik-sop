<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Noahkosmetik Sheets</title>
<meta name="theme-color" content="#a67c52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Noah SOPs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Marcellus&display=swap">
<style>
/* Layout: ein ruhiger Lesestreifen. SOPs mit Kopfblock, Start mit Gruppen nach Rhythmus,
   Einarbeitung als Matrix und als Einzelansicht pro Person.
   Look folgt der Noahkosmetik Website: warmes Hellgrau, Goldbraun, leichte Schrift. */
:root {
  --bg: #eae8e4;
  --surface: #f3f1ed;
  --ink: #2b2622;
  --muted: #6f6962;
  --gold: #8f6a40;
  --gold-fill: #a67c52;
  --on-gold: #ffffff;
  --line: #d2cdc5;
  --gap-bg: #f3e1c4;
  --gap-fg: #7d4510;
  --font-display: "Marcellus", "Optima", "Palatino Linotype", Georgia, serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1a17;
    --surface: #26221e;
    --ink: #ece6dd;
    --muted: #a49c92;
    --gold: #d2a978;
    --gold-fill: #c39a6a;
    --on-gold: #1d1a17;
    --line: #3b352f;
    --gap-bg: #4a3a22;
    --gap-fg: #f0c98e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1a17;
  --surface: #26221e;
  --ink: #ece6dd;
  --muted: #a49c92;
  --gold: #d2a978;
  --gold-fill: #c39a6a;
  --on-gold: #1d1a17;
  --line: #3b352f;
  --gap-bg: #4a3a22;
  --gap-fg: #f0c98e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.5;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-fill); outline-offset: 2px; }

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}

/* Kopf */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mark { font-size: 30px; font-weight: 300; letter-spacing: -0.015em; text-decoration: none; }
.top small { color: var(--muted); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
.nav { display: flex; gap: 8px; margin-top: 16px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.nav a, .pills a {
  flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 14px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 22px; text-decoration: none;
  font-size: 15px; color: var(--muted);
}
.nav a[aria-current="page"], .pills a[aria-current="page"] { background: var(--gold-fill); border-color: var(--gold-fill); color: var(--on-gold); font-weight: 500; }
.pills { display: flex; gap: 8px; margin: 4px 0 20px; overflow-x: auto; padding-bottom: 6px; }

h1 { font-family: var(--font-display); font-weight: 400; color: var(--gold); font-size: clamp(30px, 6vw, 44px); line-height: 1.12; margin: 36px 0 12px; text-wrap: balance; }
h2.sec { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 28px 0 12px; }
.lead { color: var(--muted); max-width: 62ch; margin: 0 0 8px; font-weight: 300; }
.team { margin: 0 0 28px; font-size: 15px; }
.team b { font-weight: 500; }
.eyebrow { margin: 32px 0 0; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow + h1 { margin-top: 6px; }

/* Start */
.start { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 16px; margin: 0 0 8px; }
.start-row { display: grid; grid-template-columns: 96px 1fr; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.start-row:last-child { border-bottom: 0; }
.start-row .when { font-family: var(--font-display); color: var(--gold); font-size: 19px; }
.start-row p { margin: 0 0 6px; font-size: 15.5px; }
.start-row .links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; }
.start-row .links a { min-height: 32px; display: inline-flex; align-items: center; color: var(--gold); }
.hint { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.group-title { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 32px 0 8px; }
.list { border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 4px 12px;
  padding: 16px 4px; min-height: 64px; border-bottom: 1px solid var(--line); text-decoration: none;
}
.row:hover { background: var(--surface); }
.row .no { font-family: var(--font-display); font-size: 22px; color: var(--gold); line-height: 1; white-space: nowrap; }
.row .ttl { font-size: 18px; }
.row .meta { font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row .meta.warn { color: var(--gap-fg); font-weight: 500; }

/* SOP Kopfblock */
.meta-block { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; margin: 16px 0 8px; border-top: 1px solid var(--line); }
.mrow { padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.mrow:first-child { grid-column: 1 / -1; }
.mrow dt { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.mrow dd { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.see { font-size: 15px; margin: 24px 0 0; color: var(--muted); }
.see a { color: var(--gold); }

.progress { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold-fill); }
.reset { border: 1px solid var(--line); background: transparent; border-radius: 20px; min-height: 44px; padding: 0 16px; cursor: pointer; color: var(--muted); font-size: 14px; }
.reset:hover { background: var(--surface); }

ol.steps, ul.subs { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 0 4px; margin-bottom: 10px; }
.step > .n { font-family: var(--font-display); color: var(--gold); font-size: 22px; line-height: 44px; }
.step .body { min-width: 0; }
.chk {
  display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; min-height: 44px;
}
.chk .box {
  flex: 0 0 22px; width: 22px; height: 22px; margin-top: 1px; border: 1.5px solid var(--muted); border-radius: 50%;
  display: grid; place-items: center; color: transparent;
}
.chk .box svg { width: 13px; height: 13px; }
.chk[aria-checked="true"] .box { background: var(--gold-fill); border-color: var(--gold-fill); color: var(--on-gold); }
.chk[aria-checked="true"] .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.txt { min-width: 0; overflow-wrap: anywhere; }
.head { font-weight: 500; padding: 10px 2px 8px; overflow-wrap: anywhere; }
ul.subs { display: grid; gap: 8px; margin: 0 0 4px 0; }
.read { padding: 10px 2px 8px; overflow-wrap: anywhere; }
ul.bul { margin: 8px 0 4px; padding-left: 20px; display: grid; gap: 8px; }
ul.bul li::marker { color: var(--gold); }

.gap {
  display: inline-block; background: var(--gap-bg); color: var(--gap-fg); border-radius: 6px;
  padding: 0 8px; font-size: 14px; font-weight: 500; line-height: 1.6; margin: 0 2px;
}

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
.pager a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 22px; text-decoration: none; font-size: 15px; }
.pager a:hover { background: var(--surface); }

/* Einarbeitung: Matrix */
.status { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.status b { font-weight: 500; color: var(--ink); }
.rule { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; margin: 0 0 16px; font-size: 15px; }
.rule b { font-weight: 500; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.grid { border-collapse: collapse; width: 100%; min-width: 0; font-size: 15px; }
.grid th, .grid td { border-bottom: 1px solid var(--line); padding: 0; }
.grid tr:last-child td { border-bottom: 0; }
.grid thead th { padding: 12px 0 10px; font-weight: 500; font-size: 12.5px; text-align: center; vertical-align: bottom; }
.grid thead th a { text-decoration: none; }
.grid thead th small { display: block; font-weight: 300; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid th.item, .grid td.item { text-align: left; padding: 10px 4px 10px 10px; min-width: 0; font-size: 13px; font-weight: 400; overflow-wrap: normal; word-break: normal; }
.grid tr.group td { background: var(--bg); font-weight: 500; padding: 10px 12px; color: var(--gold); font-size: 14px; }
.mcell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; min-width: 44px; padding: 4px 0; text-decoration: none; }
.mcell:hover .sym { border-color: var(--gold-fill); }
.mcell .date { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 13px; }
.sym { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 1.5px solid var(--muted); color: transparent; }
.sym svg { width: 14px; height: 14px; }
.sym.done { background: var(--gold-fill); border-color: var(--gold-fill); color: var(--on-gold); }
.sym.plan { border: 2px dashed var(--gold-fill); }
.sym.miss { background: var(--gap-bg); border-color: var(--gap-bg); color: var(--gap-fg); }
.sym.late { border: 2px solid var(--gap-fg); color: var(--gap-fg); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); margin: 12px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sym { width: 16px; height: 16px; font-size: 10px; border-width: 1.5px; }
.legend .sym svg { width: 10px; height: 10px; }
ul.sums { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 4px; border-top: 1px solid var(--line); }
ul.sums li { border-bottom: 1px solid var(--line); }
ul.sums a { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 12px 4px; min-height: 48px; text-decoration: none; font-size: 15px; }
ul.sums a:hover { background: var(--surface); }
ul.sums b { font-weight: 500; min-width: 64px; }
ul.sums .num { color: var(--muted); }

/* Einarbeitung: Person */
ul.eins { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.einrow { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; display: grid; gap: 10px; }
.einrow.warn { border-color: var(--gap-fg); }
.einhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.einlabel { font-weight: 500; }
.flags { display: contents; }
.dateline input[type="text"] { flex: 1 1 160px; min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; background: var(--bg); }
.seg button { min-height: 44px; border: 0; background: transparent; cursor: pointer; font-size: 15px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--gold-fill); color: var(--on-gold); font-weight: 500; }
.dateline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 14px; color: var(--muted); }
.dateline input { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 16px; }

.pin-form { display: grid; gap: 12px; max-width: 360px; margin-top: 20px; }
.pin-form label { font-size: 14px; color: var(--muted); }
.pin-form input[type="password"], .pin-form input[type="text"] { min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 18px; letter-spacing: 0.06em; }
.pin-form .remember { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; color: var(--ink); }
.pin-form .remember input { width: 22px; height: 22px; accent-color: var(--gold-fill); }
.pin-error { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--gap-bg); color: var(--gap-fg); font-size: 15px; font-weight: 500; }
.btn { min-height: 48px; padding: 0 22px; border: 0; border-radius: 24px; background: var(--gold-fill); color: var(--on-gold); font-size: 16px; font-weight: 500; cursor: pointer; justify-self: start; }
.linkbtn { border: 0; background: none; padding: 0 4px; min-height: 32px; color: var(--gold); text-decoration: underline; cursor: pointer; font-size: 14px; }
.toast {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.toast div { background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-size: 15px; max-width: 520px; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .meta-block { grid-template-columns: 1fr; }
  .row { grid-template-columns: 56px 1fr; }
  .row .meta { grid-column: 2; text-align: left; }
  .step { grid-template-columns: 26px 1fr; }
  .start-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .chk, .reset, .row, .seg button { transition: background-color .15s ease, border-color .15s ease; }
}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="config.js"></script>
<script>

  /* ---------- SOP Inhalte ---------- */
  var SOPS = [

  }

        h('span', null, sym('open'), 'Offen')),
      h('h2', { class: 'sec' }, 'Pro Person'),
      h('ul', { class: 'sums' }, sums),
      pager(['#sheet-6', 'Zurück zu SOP 06'], null));
  }

  function setStatus(key, id, s) {
    var d = prog[key] || (prog[key] = {});
    var cur = d[id];
    var by = cur && cur.by ? cur.by : '';
    if (s === 'none') { if (by) d[id] = { s: 'none', d: '', by: by }; else delete d[id]; }
    else if (s === 'planned') d[id] = { s: 'planned', d: cur && cur.s === 'planned' ? cur.d : '', by: by };
    else d[id] = { s: 'done', d: cur && cur.s === 'done' && cur.d ? cur.d : today(), by: by };
    lastFocus = key + ':' + id + ':' + s;
    render();
    save(key, id);
  }
  function setDate(key, id, v) {
    var rec = (prog[key] || {})[id];
    if (!rec) return;
    if (!v && rec.s === 'done') v = today();
    rec.d = v;
    lastFocus = key + ':' + id + ':date';
    render();
    save(key, id);
  }
  function setBy(key, id, v) {
    var d = prog[key] || (prog[key] = {});
    var rec = d[id];
    v = String(v || '').trim();
    if (!rec) { if (v) d[id] = { s: 'none', d: '', by: v }; }
    else { rec.by = v; if (rec.s === 'none' && !v) delete d[id]; }
    save(key, id);
  }

  function flagsFor(s) {
    var f = [];
    if (s.missing) f.push(h('span', { class: 'gap' }, 'Termin fehlt'));
    if (s.noWho) f.push(h('span', { class: 'gap' }, 'Durch wen fehlt'));
    if (s.overdue) f.push(h('span', { class: 'gap' }, 'Termin vorbei, bitte Status prüfen'));
    return f;
  }

  function itemRow(key, it) {
    var s = st(key, it);
    var flagBox = h('span', { class: 'flags' }, flagsFor(s));
    var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Status ' + it.label },
      [['none', 'Offen'], ['planned', 'Geplant'], ['done', 'Erledigt']].map(function (o) {
        return h('button', { type: 'button', 'aria-pressed': s.s === o[0] ? 'true' : 'false', 'data-id': key + ':' + it.id + ':' + o[0], onclick: function () { setStatus(key, it.id, o[0]); } }, o[1]);
      }));
    var inputId = 'd-' + key + '-' + it.id;
    var dateRow = s.s === 'none' ? null : h('label', { class: 'dateline', for: inputId },
      h('span', null, s.s === 'done' ? 'Schulung am' : 'Geplant für'),
      h('input', { type: 'date', id: inputId, value: s.d, 'data-id': key + ':' + it.id + ':date', onchange: function (e) { setDate(key, it.id, e.target.value); } }));
    var li;
    var whoRow = null;
    if (it.who) {
      var whoId = 'w-' + key + '-' + it.id;
      whoRow = h('label', { class: 'dateline', for: whoId },
        h('span', null, 'Eingearbeitet durch'),
        h('input', { type: 'text', id: whoId, list: 'names', value: s.by, maxlength: '40', autocomplete: 'off', placeholder: 'Name', 'data-id': key + ':' + it.id + ':by',
          onchange: function (e) {
            setBy(key, it.id, e.target.value);
            var s2 = st(key, it);
            flagBox.replaceChildren.apply(flagBox, flagsFor(s2));
            li.classList.toggle('warn', !!(s2.missing || s2.overdue || s2.noWho));
          } }));
    }
    li = h('li', { class: 'einrow' + (s.missing || s.overdue || s.noWho ? ' warn' : '') },
      h('div', { class: 'einhead' }, h('span', { class: 'einlabel' }, it.label), flagBox), seg, whoRow, dateRow);
    return li;
  }

  function personView(key) {
    var i = KEYS.indexOf(key), name = TEAM[i], c = counts(key);
    var pills = [h('a', { href: '#einarbeitung' }, 'Team')].concat(KEYS.map(function (k, j) {
      return h('a', { href: '#einarbeitung-' + k, 'aria-current': k === key ? 'page' : null }, TEAM[j]);
    }));
    var kids = [
      h('p', { class: 'eyebrow' }, 'Einarbeitungsbogen'),
      h('h1', null, name),
      h('nav', { class: 'pills', 'aria-label': 'Person wählen' }, pills),
      statusLine(),
      h('p', { class: 'status' }, h('b', null, c.done + ' von ' + c.total + ' erledigt. '), c.planned + ' geplant' + (c.missing ? ', ' + c.missing + ' ohne Termin' : '') + (c.noWho ? ', ' + c.noWho + ' ohne Person' : '') + '.'),
      h('datalist', { id: 'names' }, TEAM.map(function (n) { return h('option', { value: n }); })),
      ruleBox()
    ];
    EIN_GROUPS.forEach(function (g) {
      kids.push(h('h2', { class: 'sec' }, g.title));
      kids.push(h('p', { class: 'hint', style: 'margin:-6px 0 12px' }, g.note));
      kids.push(h('ul', { class: 'eins' }, g.items.map(function (it) { return itemRow(key, it); })));
    });
    kids.push(pager(['#einarbeitung', 'Zur Übersicht'], null));
    return h('main', null, kids);
  }

  /* ---------- Rendern ---------- */
  var lastFocus = null;
  var pendingRender = false;
  function softRender() {
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT' && a.dataset.dirty === '1') { pendingRender = true; return; }
    render();
  }
  document.addEventListener('input', function (e) { if (e.target && e.target.tagName === 'INPUT') e.target.dataset.dirty = '1'; });
  document.addEventListener('change', function (e) { if (e.target && e.target.dataset) delete e.target.dataset.dirty; });
  document.addEventListener('focusout', function () {
    if (!pendingRender) return;
    setTimeout(function () {
      var a = document.activeElement;
      if (pendingRender && !(a && a.tagName === 'INPUT' && a.dataset.dirty === '1')) render();
    }, 600);
  });
  function render() {
    pendingRender = false;
    var y = window.scrollY;
    var r = route();
    var app = document.getElementById('app');
    var gated = configured && dbState !== 'live' && (r.v === 'ein' || r.v === 'person');
    app.replaceChildren(header(r), gated ? gateView() : r.v === 'home' ? home() : r.v === 'sop' ? sopView(r.n) : r.v === 'ein' ? einView() : personView(r.key));
    window.scrollTo(0, y);
    if (gated && dbState === 'locked') { var pe = document.getElementById('pin'); if (pe) pe.focus({ preventScroll: true }); }
    if (lastFocus) {
      var el = app.querySelector('[data-id="' + lastFocus + '"]');
      if (el) el.focus({ preventScroll: true });
    }
  }
  window.addEventListener('hashchange', function () { lastFocus = null; render(); window.scrollTo(0, 0); });

  render();
  if (configured) { var savedPin = lsGet('nk-pin'); if (savedPin) unlock(savedPin, true); }
})();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
